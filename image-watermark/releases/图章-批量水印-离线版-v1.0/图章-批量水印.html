<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="批量为商品图添加文字和 Logo 水印，图片只在当前设备处理。" />
    <title>图章 · 批量水印</title>
    <style>:root {
  --ink: #172027;
  --ink-2: #2d383e;
  --paper: #f2f3ef;
  --surface: #fbfcf9;
  --panel: #e5e8e2;
  --line: #cdd3cb;
  --line-dark: #aeb7ad;
  --muted: #6c7770;
  --orange: #e34d2f;
  --orange-dark: #bd351d;
  --blue: #3156d8;
  --green: #25805c;
  --focus: rgba(49, 86, 216, .3);
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { color: inherit; }
button, input[type="range"], input[type="color"] { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.app-shell { width: 100%; height: 100vh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  flex: 0 0 auto;
  min-height: 70px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  padding: 10px 18px;
  border-bottom: 1px solid #11191e;
  background: var(--ink);
  color: white;
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark { display: grid; width: 39px; height: 39px; place-items: center; background: var(--orange); font-size: 18px; font-weight: 900; transform: rotate(-3deg); }
.brand div { display: flex; align-items: baseline; gap: 10px; }
.brand strong { font-size: 19px; letter-spacing: .08em; }
.brand span:last-child { color: #aeb8bb; font-size: 12px; }
.topbar-note { display: flex; align-items: center; gap: 8px; color: #cad1d2; font-size: 12px; }
.privacy-dot { width: 7px; height: 7px; border-radius: 50%; background: #68d39c; box-shadow: 0 0 0 4px rgba(104,211,156,.12); }
.topbar-actions { display: flex; justify-content: flex-end; gap: 8px; }

.button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 7px; padding: 0 15px; font-size: 13px; font-weight: 750; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
.button:active { transform: translateY(1px); }
.button svg { width: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.button:disabled { cursor: not-allowed; opacity: .45; }
.button-quiet { border-color: #445158; background: transparent; color: #e0e4e3; }
.button-quiet:hover { background: #263239; }
.button-primary { min-width: 130px; background: var(--orange); color: white; }
.button-primary:hover:not(:disabled) { background: #f05a3c; }
.button-dark { background: var(--ink); color: white; }
.button-dark:hover { background: var(--ink-2); }

.workspace { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 300px minmax(420px, 1fr) 286px; overflow: hidden; }
.control-panel { min-height: 0; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; overscroll-behavior: contain; }
.control-section { padding: 18px; border-bottom: 1px solid var(--line); }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
.section-heading h2 { margin: 0; font-size: 14px; }
.section-heading > span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.drop-zone { width: 100%; min-height: 91px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px dashed var(--line-dark); border-radius: 8px; background: #f3f5f1; }
.drop-zone:hover { border-color: var(--orange); background: #fff8f5; }
.drop-zone:disabled { cursor: not-allowed; opacity: .55; border-color: var(--line-dark); background: #f3f5f1; }
.drop-zone svg { width: 23px; margin-bottom: 2px; fill: none; stroke: var(--orange); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.drop-zone strong { font-size: 13px; }
.drop-zone span, .limit-copy { color: var(--muted); font-size: 10px; }
.limit-copy { margin: 8px 0 0; text-align: center; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.switch-row > span { display: flex; flex-direction: column; gap: 3px; }
.switch-row strong { font-size: 14px; }
.switch-row small { color: var(--muted); font-size: 10px; }
.switch-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch-row i { position: relative; width: 36px; height: 20px; flex: 0 0 auto; border-radius: 12px; background: #bec5bd; transition: background .15s; }
.switch-row i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; transition: transform .15s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.switch-row input:checked + i { background: var(--ink); }
.switch-row input:checked + i::after { transform: translateX(16px); }
.switch-row input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
.field-group { display: grid; gap: 13px; margin-top: 16px; }
.field-group.is-muted { opacity: .42; pointer-events: none; }
.field-label { display: block; margin-bottom: 6px; color: #4e5a53; font-size: 10px; font-weight: 750; }
.text-input { width: 100%; height: 39px; border: 1px solid var(--line); border-radius: 6px; background: white; padding: 0 10px; color: var(--ink); font-size: 13px; }
.text-input:focus { border-color: var(--blue); outline: 3px solid rgba(49,86,216,.12); }
.split-fields { display: grid; grid-template-columns: 58px 1fr; gap: 13px; align-items: end; }
.color-input { width: 48px; height: 35px; padding: 3px; border: 1px solid var(--line); border-radius: 5px; background: white; }
.range-field { display: grid; gap: 7px; }
.range-label { display: flex; justify-content: space-between; color: #4f5b54; font-size: 10px; font-weight: 650; }
.range-label output { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; height: 4px; accent-color: var(--orange); }
.logo-picker { width: 100%; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 7px; background: white; padding: 8px; text-align: left; }
.logo-preview { width: 42px; height: 42px; display: grid; flex: 0 0 auto; place-items: center; overflow: hidden; border: 1px solid #d8ddd6; background-color: #eef0ec; background-image: linear-gradient(45deg,#d9ddd7 25%,transparent 25%),linear-gradient(-45deg,#d9ddd7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d9ddd7 75%),linear-gradient(-45deg,transparent 75%,#d9ddd7 75%); background-position: 0 0,0 6px,6px -6px,-6px 0; background-size: 12px 12px; }
.logo-preview svg { width: 20px; fill: none; stroke: #7c8780; stroke-width: 1.5; }
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }
.logo-picker > span:last-child { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.logo-picker strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.logo-picker small { color: var(--muted); font-size: 9px; }

.arrangement-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 15px; }
.arrangement-tabs button { height: 31px; border: 1px solid var(--line); border-radius: 4px; background: #f4f5f2; color: #5d6861; font-size: 10px; font-weight: 750; }
.arrangement-tabs button:hover { border-color: var(--line-dark); color: var(--ink); }
.arrangement-tabs button.is-selected { border-color: var(--orange); background: #fff0eb; color: var(--orange-dark); }
.arrangement-label { margin-top: 2px; }
.position-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 17px; }
.position-grid button { position: relative; height: 31px; border: 1px solid var(--line); border-radius: 4px; background: #f4f5f2; }
.position-grid button::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #89948c; }
.position-grid button:nth-child(3n+1)::after { left: 6px; }
.position-grid button:nth-child(3n+2)::after { left: calc(50% - 3px); }
.position-grid button:nth-child(3n)::after { right: 6px; }
.position-grid button:nth-child(-n+3)::after { top: 5px; }
.position-grid button:nth-child(n+4):nth-child(-n+6)::after { top: calc(50% - 3px); }
.position-grid button:nth-child(n+7)::after { bottom: 5px; }
.position-grid button.is-selected { border-color: var(--orange); background: #fff0eb; }
.position-grid button.is-selected::after { background: var(--orange); box-shadow: 0 0 0 3px rgba(227,77,47,.14); }
.pattern-controls { margin-bottom: 16px; padding: 12px; border: 1px solid #d9ded7; border-radius: 6px; background: #f2f4f0; }
.pattern-summary { margin: 10px 0 0; color: var(--orange-dark); font-size: 9px; font-weight: 700; text-align: right; }
.is-hidden { display: none !important; }
.common-range { margin-top: 16px; }
.control-section > .range-field + .range-field { margin-top: 16px; }

.proof-area { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); }
.proof-toolbar { min-height: 56px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); background: #f8f9f6; }
.proof-file { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.proof-toolbar strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.proof-kicker { color: var(--orange-dark); font-size: 10px; font-weight: 850; }
.proof-size { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.proof-tools { display: flex; flex: 0 0 auto; align-items: center; gap: 9px; }
.image-navigation, .zoom-controls { display: flex; align-items: center; gap: 4px; }
.image-navigation { padding-right: 8px; border-right: 1px solid var(--line); }
.image-navigation span { min-width: 31px; color: var(--muted); font-size: 9px; text-align: center; font-variant-numeric: tabular-nums; }
.tool-button, .view-button { height: 29px; border: 1px solid var(--line); border-radius: 5px; background: white; color: #4f5b54; }
.tool-button { width: 29px; padding: 0; font-size: 18px; line-height: 1; }
.view-button { padding: 0 8px; font-size: 9px; font-weight: 750; }
.tool-button:hover:not(:disabled), .view-button:hover:not(:disabled) { border-color: var(--orange); color: var(--orange-dark); }
.tool-button:disabled, .view-button:disabled { cursor: not-allowed; opacity: .38; }
.view-button.is-active { border-color: var(--ink); background: var(--ink); color: white; }
.zoom-controls output { min-width: 39px; color: var(--ink); font-size: 9px; text-align: center; font-variant-numeric: tabular-nums; }
.canvas-stage { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; padding: clamp(20px, 4vw, 52px); }
.canvas-stage.has-image { display: flex; align-items: flex-start; justify-content: flex-start; overflow: auto; overscroll-behavior: contain; }
.canvas-stage::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#bbc1ba 0.7px, transparent 0.7px); background-size: 13px 13px; opacity: .38; pointer-events: none; }
.empty-state { position: relative; z-index: 1; max-width: 390px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.empty-state h1 { margin: 23px 0 8px; font-size: clamp(24px, 4vw, 38px); line-height: 1.05; letter-spacing: -.045em; }
.empty-state p { max-width: 340px; margin: 0 0 22px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.empty-illustration { position: relative; width: 146px; height: 104px; }
.empty-illustration span { position: absolute; width: 88px; height: 88px; border: 2px solid var(--ink); background: #f8f9f6; box-shadow: 6px 6px 0 rgba(23,32,39,.12); }
.empty-illustration span:nth-child(1) { left: 5px; top: 12px; transform: rotate(-8deg); }
.empty-illustration span:nth-child(2) { right: 5px; top: 4px; transform: rotate(7deg); background: #d9ddd7; }
.empty-illustration span:nth-child(3) { width: 38px; height: 38px; right: 3px; bottom: 1px; border: 0; border-radius: 50%; background: var(--orange); box-shadow: none; }
.empty-illustration span:nth-child(3)::after { content: "图"; display: grid; height: 100%; place-items: center; color: white; font-weight: 900; }
.canvas-wrap { position: relative; z-index: 1; display: grid; flex: 0 0 auto; place-items: center; margin: auto; padding: 10px; background: #f8f8f5; box-shadow: 0 20px 55px rgba(23,32,39,.21), 0 0 0 1px rgba(23,32,39,.15); }
.canvas-wrap canvas { display: block; max-width: none; max-height: none; background: white; object-fit: contain; }
.preview-badge { position: absolute; right: 10px; bottom: 10px; border: 1px solid rgba(255,255,255,.32); background: rgba(23,32,39,.78); color: white; padding: 3px 6px; font-size: 8px; font-weight: 800; }
.drop-overlay { position: absolute; z-index: 5; inset: 14px; display: none; place-items: center; border: 2px dashed var(--orange); background: rgba(255,247,243,.92); color: var(--orange-dark); font-size: 17px; font-weight: 800; }
.canvas-stage.is-dragging .drop-overlay { display: grid; }
.live-message { min-height: 29px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid var(--line); background: #f8f9f6; color: var(--muted); font-size: 10px; }
.live-message.is-error { color: #a42d1a; background: #fff5f1; }
.live-message.is-success { color: #176344; background: #f1faf5; }

.contact-sheet { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--line); background: #f7f8f5; }
.contact-heading { min-height: 69px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px; border-bottom: 1px solid var(--line); }
.contact-heading h2 { margin: 0; font-size: 14px; }
.contact-heading p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }
.icon-button { width: 31px; height: 31px; border: 1px solid var(--line); border-radius: 5px; background: white; font-size: 19px; line-height: 1; }
.icon-button:hover { border-color: var(--orange); color: var(--orange); }
.icon-button:disabled { cursor: not-allowed; opacity: .45; border-color: var(--line); color: inherit; }
.selection-toolbar { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: #eef1ec; }
.selection-toolbar label { display: flex; align-items: center; gap: 7px; color: #4e5a53; font-size: 9px; font-weight: 750; }
.selection-toolbar input { width: 15px; height: 15px; accent-color: var(--orange); }
.selection-toolbar > span { color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
.image-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 9px; }
.list-empty { min-height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
.list-empty span { font-size: 12px; font-weight: 750; }
.list-empty small { max-width: 180px; margin-top: 7px; font-size: 9px; line-height: 1.6; }
.image-card { width: 100%; display: grid; grid-template-columns: 18px 58px minmax(0,1fr) auto; gap: 8px; align-items: center; margin-bottom: 7px; border: 1px solid var(--line); border-radius: 6px; background: white; padding: 6px; text-align: left; }
.image-card:hover { border-color: var(--line-dark); }
.image-card.is-selected { border-color: var(--orange); box-shadow: inset 3px 0 0 var(--orange); }
.image-card.is-error { background: #fff7f4; }
.export-check { position: relative; width: 18px; height: 22px; display: grid; place-items: center; cursor: pointer; }
.export-check input { position: absolute; opacity: 0; }
.export-check span { width: 15px; height: 15px; display: grid; place-items: center; border: 1px solid var(--line-dark); border-radius: 3px; background: white; }
.export-check input:checked + span { border-color: var(--orange); background: var(--orange); }
.export-check input:checked + span::after { content: ""; width: 7px; height: 4px; border-left: 2px solid white; border-bottom: 2px solid white; transform: translateY(-1px) rotate(-45deg); }
.export-check input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.export-check input:disabled + span { cursor: not-allowed; opacity: .42; }
.thumb { width: 58px; height: 48px; display: grid; place-items: center; overflow: hidden; background: #e7eae5; color: #9c4434; font-size: 10px; font-weight: 800; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.image-meta { min-width: 0; }
.image-meta strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.image-meta span { display: block; margin-top: 4px; color: var(--muted); font-size: 8px; }
.image-meta .status-error { color: #a42d1a; white-space: normal; line-height: 1.35; }
.card-actions { display: flex; flex-direction: column; gap: 4px; }
.mini-action { width: 26px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 4px; background: #eef0ec; color: #4e5a53; font-size: 12px; }
.mini-action:hover { background: #dfe3dc; color: var(--ink); }
.mini-action:disabled { cursor: not-allowed; opacity: .35; }
.batch-summary { display: flex; justify-content: space-between; padding: 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: 9px; }
.batch-summary strong { color: var(--ink); font-size: 10px; }
.statusbar { min-height: 27px; display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 20px; padding: 0 13px; border-top: 1px solid #11191e; background: var(--ink); color: #9fa9ac; font-size: 8px; }
.statusbar span:first-child { display: flex; align-items: center; gap: 6px; }
.statusbar i { width: 5px; height: 5px; border-radius: 50%; background: #68d39c; }

@media (max-width: 1100px) {
  .workspace { grid-template-columns: 280px minmax(380px,1fr); grid-template-rows: minmax(500px, 1fr) auto; overflow-y: auto; }
  .contact-sheet { min-height: 220px; grid-column: 1 / -1; border-top: 1px solid var(--line); border-left: 0; }
  .image-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); grid-auto-rows: max-content; align-content: start; gap: 7px; max-height: 260px; }
  .image-card { margin: 0; }
  .list-empty { grid-column: 1 / -1; min-height: 120px; }
}
@media (max-width: 720px) {
  html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  .app-shell { height: auto; min-height: 100vh; overflow: visible; }
  .topbar { grid-template-columns: 1fr auto; min-height: 62px; padding: 9px 11px; }
  .topbar-note { display: none; }
  .brand span:last-child, .reset-button { display: none; }
  .brand-mark { width: 34px; height: 34px; }
  .button-primary { min-width: 112px; padding: 0 11px; }
  .topbar-actions .button-quiet { padding: 0 10px; }
  .workspace { display: flex; flex-direction: column; overflow: visible; }
  .control-panel { order: 2; border-right: 0; }
  .proof-area { order: 1; min-height: 520px; overflow: visible; }
  .contact-sheet { order: 3; min-height: 260px; overflow: visible; }
  .canvas-stage { min-height: 420px; padding: 22px 14px; }
  .proof-tools { width: 100%; justify-content: space-between; }
  .proof-file { width: 100%; }
  .proof-size { display: none; }
  .control-panel { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
  .control-section { border-right: 1px solid var(--line); }
  .import-section { grid-column: 1 / -1; }
  .statusbar span:nth-child(2) { display: none; }
  .image-list { max-height: 320px; }
}
@media (max-width: 480px) {
  .brand div { gap: 0; }
  .topbar-actions { gap: 4px; }
  .button-primary { min-width: 104px; font-size: 11px; }
  .topbar-actions .button-quiet { font-size: 10px; }
  .proof-file { display: block; }
  .proof-kicker { display: block; margin-bottom: 3px; }
  .proof-tools { gap: 5px; }
  .image-navigation { padding-right: 5px; }
  .view-button { padding: 0 6px; }
  .control-panel { display: block; }
  .canvas-stage { min-height: 390px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="图章批量水印">
          <span class="brand-mark" aria-hidden="true">图</span>
          <div><strong>图章</strong><span>商品图批量水印</span></div>
        </div>
        <div class="topbar-note"><span class="privacy-dot"></span>图片仅在本机处理</div>
        <div class="topbar-actions">
          <button class="button button-quiet reset-button" id="resetButton" type="button">清空重来</button>
          <button class="button button-quiet" id="exportAllButton" type="button" disabled>
            <span id="exportAllLabel">全部导出</span>
          </button>
          <button class="button button-primary" id="exportButton" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v4h14v-4" /></svg>
            <span id="exportLabel">导出选中</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="control-panel" aria-label="水印设置">
          <section class="control-section import-section">
            <div class="section-heading"><h2>商品图片</h2><span id="imageCount">0 / 20</span></div>
            <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden />
            <button class="drop-zone" id="addImagesButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V19h16v-2.5M12 4v10m0-10 4 4m-4-4L8 8" /></svg>
              <strong>添加商品图</strong>
              <span>JPG、PNG、WebP</span>
            </button>
            <p class="limit-copy">最多 20 张，总计不超过 100 MB</p>
          </section>

          <section class="control-section">
            <label class="switch-row" for="textEnabled">
              <span><strong>文字水印</strong><small>店铺名、品牌名或版权信息</small></span>
              <input id="textEnabled" type="checkbox" checked /><i aria-hidden="true"></i>
            </label>
            <div class="field-group" id="textControls">
              <label class="field-label" for="watermarkText">水印文字</label>
              <input class="text-input" id="watermarkText" maxlength="48" value="我的店铺" autocomplete="off" />
              <div class="split-fields">
                <label><span class="field-label">颜色</span><input class="color-input" id="textColor" type="color" value="#ffffff" /></label>
                <label class="range-field"><span class="range-label"><span>字号</span><output id="textSizeOutput">5%</output></span><input id="textSize" type="range" min="2" max="12" step="0.5" value="5" /></label>
              </div>
            </div>
          </section>

          <section class="control-section">
            <label class="switch-row" for="logoEnabled">
              <span><strong>Logo 水印</strong><small>建议使用透明 PNG</small></span>
              <input id="logoEnabled" type="checkbox" /><i aria-hidden="true"></i>
            </label>
            <div class="field-group is-muted" id="logoControls">
              <input id="logoInput" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
              <button class="logo-picker" id="logoButton" type="button">
                <span class="logo-preview" id="logoPreview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l4-4 3 3 2-2 7 6M15.5 9.5h.01" /></svg></span>
                <span><strong id="logoName">选择 Logo 图片</strong><small>点击替换</small></span>
              </button>
              <label class="range-field"><span class="range-label"><span>Logo 宽度</span><output id="logoSizeOutput">18%</output></span><input id="logoSize" type="range" min="5" max="45" step="1" value="18" /></label>
            </div>
          </section>

          <section class="control-section">
            <div class="section-heading"><h2>排列与透明度</h2></div>
            <span class="field-label">排列方式</span>
            <div class="arrangement-tabs" id="arrangementTabs" role="radiogroup" aria-label="水印排列方式">
              <button class="is-selected" type="button" data-arrangement="single" role="radio" aria-checked="true">单个</button>
              <button type="button" data-arrangement="tile" role="radio" aria-checked="false">平铺</button>
              <button type="button" data-arrangement="stagger" role="radio" aria-checked="false">错位</button>
              <button type="button" data-arrangement="random" role="radio" aria-checked="false">随机</button>
            </div>
            <div id="singlePlacementControls">
              <span class="field-label arrangement-label">单个位置</span>
              <div class="position-grid" id="positionGrid" role="radiogroup" aria-label="水印位置">
                <button type="button" data-position="top-left" role="radio" aria-label="左上" aria-checked="false"></button>
                <button type="button" data-position="top-center" role="radio" aria-label="顶部居中" aria-checked="false"></button>
                <button type="button" data-position="top-right" role="radio" aria-label="右上" aria-checked="false"></button>
                <button type="button" data-position="center-left" role="radio" aria-label="左侧居中" aria-checked="false"></button>
                <button type="button" data-position="center" role="radio" aria-label="正中" aria-checked="false"></button>
                <button type="button" data-position="center-right" role="radio" aria-label="右侧居中" aria-checked="false"></button>
                <button type="button" data-position="bottom-left" role="radio" aria-label="左下" aria-checked="false"></button>
                <button type="button" data-position="bottom-center" role="radio" aria-label="底部居中" aria-checked="false"></button>
                <button class="is-selected" type="button" data-position="bottom-right" role="radio" aria-label="右下" aria-checked="true"></button>
              </div>
              <label class="range-field"><span class="range-label"><span>边距</span><output id="marginOutput">4%</output></span><input id="margin" type="range" min="1" max="15" step="1" value="4" /></label>
            </div>
            <div class="pattern-controls is-hidden" id="patternControls">
              <label class="range-field"><span class="range-label"><span>水印数量</span><output id="densityOutput">16 个</output></span><input id="density" type="range" min="4" max="40" step="1" value="16" /></label>
              <p class="pattern-summary" id="patternSummary">每张图片添加 16 个水印</p>
            </div>
            <label class="range-field common-range"><span class="range-label"><span>旋转角度</span><output id="angleOutput">0°</output></span><input id="angle" type="range" min="-60" max="60" step="1" value="0" /></label>
            <label class="range-field"><span class="range-label"><span>透明度</span><output id="opacityOutput">72%</output></span><input id="opacity" type="range" min="10" max="100" step="1" value="72" /></label>
          </section>
        </aside>

        <section class="proof-area" aria-label="图片预览">
          <div class="proof-toolbar">
            <div class="proof-file"><span class="proof-kicker">校样预览</span><strong id="selectedName">等待添加图片</strong></div>
            <div class="proof-tools">
              <div class="image-navigation" aria-label="切换预览图片">
                <button class="tool-button" id="previousImageButton" type="button" title="上一张（←）" aria-label="上一张" disabled>‹</button>
                <span id="previewIndex">0 / 0</span>
                <button class="tool-button" id="nextImageButton" type="button" title="下一张（→）" aria-label="下一张" disabled>›</button>
              </div>
              <span class="proof-size" id="selectedSize">—</span>
              <div class="zoom-controls" aria-label="预览缩放">
                <button class="tool-button" id="zoomOutButton" type="button" title="缩小预览" aria-label="缩小预览" disabled>−</button>
                <output id="zoomOutput">适应</output>
                <button class="tool-button" id="zoomInButton" type="button" title="放大预览" aria-label="放大预览" disabled>+</button>
                <button class="view-button is-active" id="fitButton" type="button" title="一键还原为适应窗口" disabled>适应</button>
                <button class="view-button" id="actualSizeButton" type="button" title="还原原始大小（1:1）" disabled>1:1</button>
              </div>
            </div>
          </div>
          <div class="canvas-stage" id="dropTarget">
            <div class="empty-state" id="emptyState">
              <div class="empty-illustration" aria-hidden="true"><span></span><span></span><span></span></div>
              <h1>把商品图放到这里</h1>
              <p>拖入图片，或从左侧添加。所有处理都在当前设备完成。</p>
              <button class="button button-dark" id="emptyAddButton" type="button">选择商品图片</button>
            </div>
            <div class="canvas-wrap" id="canvasWrap" hidden><canvas id="previewCanvas"></canvas><span class="preview-badge">预览</span></div>
            <div class="drop-overlay" id="dropOverlay">松开即可添加图片</div>
          </div>
          <div class="live-message" id="liveMessage" role="status" aria-live="polite"></div>
        </section>

        <aside class="contact-sheet" aria-label="已导入图片">
          <div class="contact-heading">
            <div><h2>批量清单</h2><p>统一应用当前水印设置</p></div>
            <button class="icon-button" id="addMoreButton" type="button" aria-label="继续添加图片" title="继续添加图片">+</button>
          </div>
          <div class="selection-toolbar">
            <label for="selectAllToggle"><input id="selectAllToggle" type="checkbox" /><span>全选可导出图片</span></label>
            <span id="selectionCount">已选 0 / 0</span>
          </div>
          <div class="image-list" id="imageList">
            <div class="list-empty" id="listEmpty"><span>还没有图片</span><small>导入后可在这里切换预览和逐张保存</small></div>
          </div>
          <div class="batch-summary"><span>本批次大小</span><strong id="batchSize">0 MB</strong></div>
        </aside>
      </main>

      <footer class="statusbar">
        <span><i></i>离线可用</span><span>单张直接保存 · 多张打包 ZIP</span><span>v1.0</span>
      </footer>

    <script>(() => {
  "use strict";

  const MAX_IMAGES = 20;
  const MAX_BYTES = 100 * 1024 * 1024;
  const MAX_PIXELS = 40 * 1000 * 1000;
  const PREVIEW_MAX_EDGE = 1600;
  const NO_WATERMARK_MESSAGE = "还没有可绘制的水印：请开启文字水印并填写内容，或添加并勾选 Logo。";
  const allowedExtensions = new Set(["jpg", "jpeg", "png", "webp"]);
  const byId = (id) => document.getElementById(id);

  const elements = {
    imageInput: byId("imageInput"),
    addImagesButton: byId("addImagesButton"),
    emptyAddButton: byId("emptyAddButton"),
    addMoreButton: byId("addMoreButton"),
    imageCount: byId("imageCount"),
    imageList: byId("imageList"),
    listEmpty: byId("listEmpty"),
    batchSize: byId("batchSize"),
    selectedName: byId("selectedName"),
    selectedSize: byId("selectedSize"),
    emptyState: byId("emptyState"),
    canvasWrap: byId("canvasWrap"),
    previewCanvas: byId("previewCanvas"),
    dropTarget: byId("dropTarget"),
    liveMessage: byId("liveMessage"),
    resetButton: byId("resetButton"),
    exportAllButton: byId("exportAllButton"),
    exportAllLabel: byId("exportAllLabel"),
    exportButton: byId("exportButton"),
    exportLabel: byId("exportLabel"),
    selectAllToggle: byId("selectAllToggle"),
    selectionCount: byId("selectionCount"),
    previousImageButton: byId("previousImageButton"),
    nextImageButton: byId("nextImageButton"),
    previewIndex: byId("previewIndex"),
    zoomOutButton: byId("zoomOutButton"),
    zoomInButton: byId("zoomInButton"),
    zoomOutput: byId("zoomOutput"),
    fitButton: byId("fitButton"),
    actualSizeButton: byId("actualSizeButton"),
    textEnabled: byId("textEnabled"),
    textControls: byId("textControls"),
    watermarkText: byId("watermarkText"),
    textColor: byId("textColor"),
    textSize: byId("textSize"),
    textSizeOutput: byId("textSizeOutput"),
    logoEnabled: byId("logoEnabled"),
    logoControls: byId("logoControls"),
    logoInput: byId("logoInput"),
    logoButton: byId("logoButton"),
    logoPreview: byId("logoPreview"),
    logoName: byId("logoName"),
    logoSize: byId("logoSize"),
    logoSizeOutput: byId("logoSizeOutput"),
    arrangementTabs: byId("arrangementTabs"),
    singlePlacementControls: byId("singlePlacementControls"),
    patternControls: byId("patternControls"),
    positionGrid: byId("positionGrid"),
    density: byId("density"),
    densityOutput: byId("densityOutput"),
    patternSummary: byId("patternSummary"),
    angle: byId("angle"),
    angleOutput: byId("angleOutput"),
    margin: byId("margin"),
    marginOutput: byId("marginOutput"),
    opacity: byId("opacity"),
    opacityOutput: byId("opacityOutput"),
  };

  const state = {
    images: [],
    selectedId: null,
    position: "bottom-right",
    arrangement: "single",
    exporting: false,
    previewToken: 0,
    previewImage: null,
    previewImageId: null,
    zoom: 1,
    fitZoom: 1,
    zoomMode: "fit",
    logo: { file: null, url: null, image: null, width: 0, height: 0 },
  };

  function makeId() {
    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function formatBytes(bytes) {
    if (!bytes) return "0 MB";
    if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
    return `${(bytes / 1024 / 1024).toFixed(bytes >= 10 * 1024 * 1024 ? 1 : 2)} MB`;
  }

  function extensionOf(name) {
    const match = String(name).toLowerCase().match(/\.([a-z0-9]+)$/);
    return match ? match[1] : "";
  }

  function isSupportedFile(file) {
    return ["image/jpeg", "image/png", "image/webp"].includes(file.type) || allowedExtensions.has(extensionOf(file.name));
  }

  function acceptedImages() {
    return state.images.filter((item) => item.accepted);
  }

  function exportableImages() {
    return state.images.filter((item) => item.accepted && (item.status === "ready" || item.status === "complete"));
  }

  function selectedForExportImages() {
    return exportableImages().filter((item) => item.exportSelected);
  }

  function selectedImage() {
    return state.images.find((item) => item.id === state.selectedId && item.accepted) || null;
  }

  function previewImages() {
    return state.images.filter((item) => item.accepted && (item.status === "ready" || item.status === "complete"));
  }

  function announce(message, tone = "") {
    elements.liveMessage.textContent = message;
    elements.liveMessage.className = `live-message${tone ? ` is-${tone}` : ""}`;
  }

  function setControlState() {
    elements.textControls.classList.toggle("is-muted", !elements.textEnabled.checked);
    elements.logoControls.classList.toggle("is-muted", !elements.logoEnabled.checked);
    elements.singlePlacementControls.classList.toggle("is-hidden", state.arrangement !== "single");
    elements.patternControls.classList.toggle("is-hidden", state.arrangement === "single");
  }

  function updateRangeLabels() {
    elements.textSizeOutput.textContent = `${elements.textSize.value}%`;
    elements.logoSizeOutput.textContent = `${elements.logoSize.value}%`;
    elements.densityOutput.textContent = `${elements.density.value} 个`;
    elements.patternSummary.textContent = `每张图片添加 ${elements.density.value} 个水印`;
    elements.angleOutput.textContent = `${Number(elements.angle.value)}°`;
    elements.marginOutput.textContent = `${elements.margin.value}%`;
    elements.opacityOutput.textContent = `${elements.opacity.value}%`;
  }

  function renderList() {
    elements.imageList.replaceChildren();
    const accepted = acceptedImages();
    const ready = exportableImages();
    const selectedForExport = selectedForExportImages();
    const totalBytes = accepted.reduce((sum, item) => sum + item.file.size, 0);
    elements.imageCount.textContent = `${accepted.length} / ${MAX_IMAGES}`;
    elements.batchSize.textContent = formatBytes(totalBytes);
    elements.selectionCount.textContent = `已选 ${selectedForExport.length} / ${ready.length}`;
    elements.selectAllToggle.disabled = ready.length === 0 || state.exporting;
    elements.selectAllToggle.checked = ready.length > 0 && selectedForExport.length === ready.length;
    elements.selectAllToggle.indeterminate = selectedForExport.length > 0 && selectedForExport.length < ready.length;
    elements.exportAllButton.disabled = ready.length === 0 || state.exporting;
    elements.exportButton.disabled = selectedForExport.length === 0 || state.exporting;
    elements.resetButton.disabled = state.exporting;
    elements.addImagesButton.disabled = state.exporting;
    elements.addMoreButton.disabled = state.exporting;
    elements.emptyAddButton.disabled = state.exporting;
    elements.exportAllLabel.textContent = state.exporting ? "正在处理…" : ready.length ? `全部导出 ${ready.length} 张` : "全部导出";
    elements.exportLabel.textContent = state.exporting ? "正在处理…" : selectedForExport.length ? `导出选中 ${selectedForExport.length} 张` : "导出选中";

    if (!state.images.length) {
      const empty = document.createElement("div");
      empty.className = "list-empty";
      empty.innerHTML = "<span>还没有图片</span><small>导入后可在这里切换预览和逐张保存</small>";
      elements.imageList.append(empty);
      return;
    }

    state.images.forEach((item) => {
      const card = document.createElement("div");
      card.className = `image-card${item.id === state.selectedId ? " is-selected" : ""}${item.status === "error" ? " is-error" : ""}`;
      card.tabIndex = item.accepted ? 0 : -1;
      card.setAttribute("role", item.accepted ? "button" : "group");
      if (item.accepted) card.setAttribute("aria-label", `预览 ${item.file.name}`);

      const exportCheck = document.createElement("label");
      exportCheck.className = "export-check";
      exportCheck.title = item.accepted ? "勾选后可批量导出" : "此图片不可导出";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = Boolean(item.exportSelected);
      checkbox.disabled = !item.accepted || !["ready", "complete"].includes(item.status) || state.exporting;
      checkbox.setAttribute("aria-label", `选择导出 ${item.file.name}`);
      const checkmark = document.createElement("span");
      checkmark.setAttribute("aria-hidden", "true");
      exportCheck.append(checkbox, checkmark);
      exportCheck.addEventListener("click", (event) => event.stopPropagation());
      checkbox.addEventListener("change", () => {
        item.exportSelected = checkbox.checked;
        renderList();
        announce(checkbox.checked ? `已选择导出 ${item.file.name}` : `已取消导出 ${item.file.name}`);
      });

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if (item.url) {
        const image = document.createElement("img");
        image.src = item.url;
        image.alt = "";
        thumb.append(image);
      } else {
        thumb.textContent = "无法读取";
      }

      const metadata = document.createElement("div");
      metadata.className = "image-meta";
      const name = document.createElement("strong");
      name.textContent = item.file.name;
      const detail = document.createElement("span");
      if (item.status === "error") {
        detail.className = "status-error";
        detail.textContent = item.error;
      } else if (item.status === "processing") {
        detail.textContent = "正在生成水印…";
      } else {
        const dimensions = item.width ? `${item.width} × ${item.height}` : "正在读取…";
        const status = item.status === "complete" ? " · 已导出" : "";
        detail.textContent = `${dimensions} · ${formatBytes(item.file.size)}${status}`;
      }
      metadata.append(name, detail);

      const actions = document.createElement("div");
      actions.className = "card-actions";
      const save = document.createElement("button");
      save.className = "mini-action";
      save.type = "button";
      save.textContent = "↓";
      save.title = "单独保存";
      save.setAttribute("aria-label", `单独保存 ${item.file.name}`);
      save.disabled = !item.accepted || !["ready", "complete"].includes(item.status) || state.exporting;
      save.addEventListener("click", (event) => {
        event.stopPropagation();
        exportSingle(item);
      });
      const remove = document.createElement("button");
      remove.className = "mini-action";
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "移除";
      remove.setAttribute("aria-label", `移除 ${item.file.name}`);
      remove.disabled = state.exporting;
      remove.addEventListener("click", (event) => {
        event.stopPropagation();
        removeImage(item.id);
      });
      actions.append(save, remove);

      card.append(exportCheck, thumb, metadata, actions);
      if (item.accepted) {
        const select = () => selectImage(item.id);
        card.addEventListener("click", select);
        card.addEventListener("keydown", (event) => {
          if (event.target !== card) return;
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            select();
          }
        });
      }
      elements.imageList.append(card);
    });
  }

  function createErrorRecord(file, error) {
    state.images.push({ id: makeId(), file, url: null, width: 0, height: 0, status: "error", accepted: false, exportSelected: false, error });
  }

  function probeImage(url) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
      image.onerror = () => reject(new Error("图片文件已损坏或浏览器无法解码"));
      image.src = url;
    });
  }

  async function addFiles(fileList) {
    if (state.exporting) {
      announce("正在导出，请等待完成后再添加图片。", "error");
      return;
    }
    const files = Array.from(fileList || []);
    if (!files.length) return;
    let acceptedCount = acceptedImages().length;
    let acceptedBytes = acceptedImages().reduce((sum, item) => sum + item.file.size, 0);
    let rejected = 0;

    for (const file of files) {
      if (!isSupportedFile(file)) {
        createErrorRecord(file, "不支持此格式，请使用 JPG、PNG 或 WebP");
        rejected += 1;
        continue;
      }
      if (acceptedCount >= MAX_IMAGES) {
        createErrorRecord(file, "已超过 20 张批量上限");
        rejected += 1;
        continue;
      }
      if (acceptedBytes + file.size > MAX_BYTES) {
        createErrorRecord(file, "加入后将超过 100 MB 总大小上限");
        rejected += 1;
        continue;
      }

      const url = URL.createObjectURL(file);
      const item = { id: makeId(), file, url, width: 0, height: 0, status: "loading", accepted: true, exportSelected: true, error: "" };
      state.images.push(item);
      acceptedCount += 1;
      acceptedBytes += file.size;
      renderList();

      try {
        const dimensions = await probeImage(url);
        if (dimensions.width * dimensions.height > MAX_PIXELS) {
          throw new Error("图片超过 4000 万像素，部分设备无法处理，请缩小后再导入");
        }
        item.width = dimensions.width;
        item.height = dimensions.height;
        item.status = "ready";
        if (!state.selectedId) state.selectedId = item.id;
      } catch (error) {
        item.status = "error";
        item.accepted = false;
        item.exportSelected = false;
        item.error = error instanceof Error ? error.message : "图片文件无法读取";
        acceptedCount -= 1;
        acceptedBytes -= file.size;
        URL.revokeObjectURL(url);
        item.url = null;
        rejected += 1;
      }
      renderList();
    }

    // Unsupported files and batch-limit failures skip the per-item render above.
    // Render once after the batch so every rejected item is visible immediately.
    renderList();
    elements.imageInput.value = "";
    if (state.selectedId) await loadSelectedPreview();
    const loaded = files.length - rejected;
    if (rejected) announce(`已添加 ${loaded} 张，${rejected} 个文件未加入；请查看右侧原因。`, "error");
    else announce(`已添加 ${loaded} 张图片，可以统一调整水印。`, "success");
  }

  function selectImage(id) {
    if (state.selectedId === id) return;
    state.selectedId = id;
    state.zoomMode = "fit";
    renderList();
    loadSelectedPreview();
  }

  function navigatePreview(direction) {
    const items = previewImages();
    if (!items.length) return;
    const currentIndex = Math.max(0, items.findIndex((item) => item.id === state.selectedId));
    const nextIndex = Math.min(items.length - 1, Math.max(0, currentIndex + direction));
    if (nextIndex !== currentIndex) selectImage(items[nextIndex].id);
  }

  function removeImage(id) {
    if (state.exporting) return;
    const index = state.images.findIndex((item) => item.id === id);
    if (index < 0) return;
    const [removed] = state.images.splice(index, 1);
    if (removed.url) URL.revokeObjectURL(removed.url);
    if (state.selectedId === id) {
      state.selectedId = exportableImages()[0]?.id || null;
      state.previewImage = null;
      state.previewImageId = null;
    }
    renderList();
    loadSelectedPreview();
    announce(`已移除 ${removed.file.name}`);
  }

  function clearAll() {
    if (state.exporting) return;
    state.images.forEach((item) => item.url && URL.revokeObjectURL(item.url));
    state.images = [];
    state.selectedId = null;
    state.previewImage = null;
    state.previewImageId = null;
    elements.previewCanvas.width = 1;
    elements.previewCanvas.height = 1;
    renderList();
    updatePreviewHeader();
    elements.canvasWrap.hidden = true;
    elements.emptyState.hidden = false;
    elements.dropTarget.classList.remove("has-image");
    announce("已清空，可以开始新的一批图片。");
  }

  function loadDrawable(url) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("无法读取图片"));
      image.src = url;
    });
  }

  async function loadSelectedPreview() {
    const item = selectedImage();
    updatePreviewHeader();
    if (!item || !item.url) {
      elements.canvasWrap.hidden = true;
      elements.emptyState.hidden = false;
      elements.dropTarget.classList.remove("has-image");
      updatePreviewControls();
      return;
    }
    const token = ++state.previewToken;
    try {
      const image = await loadDrawable(item.url);
      if (token !== state.previewToken || state.selectedId !== item.id) return;
      state.previewImage = image;
      state.previewImageId = item.id;
      elements.emptyState.hidden = true;
      elements.canvasWrap.hidden = false;
      elements.dropTarget.classList.add("has-image");
      updatePreviewHeader();
      drawPreview();
    } catch {
      announce(`无法预览 ${item.file.name}`, "error");
    }
  }

  function updatePreviewHeader() {
    const item = selectedImage();
    elements.selectedName.textContent = item ? item.file.name : "等待添加图片";
    if (!item) {
      elements.selectedSize.textContent = "—";
    } else {
      const dimensions = previewDimensions(item);
      elements.selectedSize.textContent = dimensions.width ? `${dimensions.width} × ${dimensions.height} px` : "正在读取…";
    }
    updatePreviewControls();
  }

  function updatePreviewControls() {
    const items = previewImages();
    const index = items.findIndex((item) => item.id === state.selectedId);
    const hasPreview = index >= 0 && state.previewImageId === state.selectedId && !elements.canvasWrap.hidden;
    elements.previewIndex.textContent = index >= 0 ? `${index + 1} / ${items.length}` : `0 / ${items.length}`;
    elements.previousImageButton.disabled = index <= 0;
    elements.nextImageButton.disabled = index < 0 || index >= items.length - 1;
    [elements.zoomOutButton, elements.zoomInButton, elements.fitButton, elements.actualSizeButton].forEach((button) => {
      button.disabled = !hasPreview;
    });
    if (!hasPreview) elements.zoomOutput.textContent = "适应";
  }

  function fitZoomForCurrentImage() {
    const item = selectedImage();
    if (!item) return 1;
    const dimensions = previewDimensions(item);
    if (!dimensions.width || !dimensions.height) return 1;
    const stageStyle = getComputedStyle(elements.dropTarget);
    const horizontalPadding = parseFloat(stageStyle.paddingLeft) + parseFloat(stageStyle.paddingRight);
    const verticalPadding = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom);
    const frameSize = 20;
    const horizontalSpace = Math.max(80, elements.dropTarget.clientWidth - horizontalPadding - frameSize);
    const verticalSpace = Math.max(80, elements.dropTarget.clientHeight - verticalPadding - frameSize);
    return Math.min(1, horizontalSpace / dimensions.width, verticalSpace / dimensions.height);
  }

  function applyZoom(value = state.zoom, mode = "manual", keepCenter = false) {
    const item = selectedImage();
    if (!item || elements.canvasWrap.hidden) return;
    const dimensions = previewDimensions(item);
    if (!dimensions.width || !dimensions.height) return;
    const oldScrollWidth = elements.dropTarget.scrollWidth;
    const oldScrollHeight = elements.dropTarget.scrollHeight;
    const centerX = oldScrollWidth ? (elements.dropTarget.scrollLeft + elements.dropTarget.clientWidth / 2) / oldScrollWidth : 0.5;
    const centerY = oldScrollHeight ? (elements.dropTarget.scrollTop + elements.dropTarget.clientHeight / 2) / oldScrollHeight : 0.5;
    state.fitZoom = fitZoomForCurrentImage();
    state.zoomMode = mode;
    state.zoom = mode === "fit" ? state.fitZoom : Math.min(4, Math.max(0.1, value));
    const displayWidth = Math.max(1, Math.round(dimensions.width * state.zoom));
    const displayHeight = Math.max(1, Math.round(dimensions.height * state.zoom));
    elements.previewCanvas.style.width = `${displayWidth}px`;
    elements.previewCanvas.style.height = `${displayHeight}px`;
    elements.canvasWrap.style.width = `${displayWidth + 20}px`;
    elements.canvasWrap.style.height = `${displayHeight + 20}px`;
    elements.zoomOutput.textContent = `${Math.round(state.zoom * 100)}%`;
    elements.fitButton.classList.toggle("is-active", mode === "fit");
    elements.actualSizeButton.classList.toggle("is-active", Math.abs(state.zoom - 1) < 0.001 && mode !== "fit");
    elements.zoomOutButton.disabled = state.zoom <= 0.1001;
    elements.zoomInButton.disabled = state.zoom >= 3.999;
    if (keepCenter) {
      requestAnimationFrame(() => {
        elements.dropTarget.scrollLeft = centerX * elements.dropTarget.scrollWidth - elements.dropTarget.clientWidth / 2;
        elements.dropTarget.scrollTop = centerY * elements.dropTarget.scrollHeight - elements.dropTarget.clientHeight / 2;
      });
    }
  }

  function setZoom(value) {
    applyZoom(value, "manual", true);
  }

  function currentSettings() {
    return {
      textEnabled: elements.textEnabled.checked && elements.watermarkText.value.trim().length > 0,
      text: elements.watermarkText.value.trim(),
      textColor: elements.textColor.value,
      textSize: Number(elements.textSize.value) / 100,
      logoEnabled: elements.logoEnabled.checked && Boolean(state.logo.image),
      logoSize: Number(elements.logoSize.value) / 100,
      logo: state.logo,
      opacity: Number(elements.opacity.value) / 100,
      margin: Number(elements.margin.value) / 100,
      position: state.position,
      arrangement: state.arrangement,
      count: Number(elements.density.value),
      angle: Number(elements.angle.value),
    };
  }

  function deterministicRandom(input) {
    let seed = 2166136261;
    for (let index = 0; index < input.length; index += 1) {
      seed ^= input.charCodeAt(index);
      seed = Math.imul(seed, 16777619);
    }
    return () => {
      seed += 0x6D2B79F5;
      let value = seed;
      value = Math.imul(value ^ (value >>> 15), value | 1);
      value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
      return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawWatermarks(context, width, height, settings, item) {
    const shortest = Math.min(width, height);
    const parts = [];
    const fontSize = Math.max(12, shortest * settings.textSize);
    const font = `800 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;

    if (settings.logoEnabled) {
      const logoWidth = width * settings.logoSize;
      const logoHeight = logoWidth * (settings.logo.height / settings.logo.width);
      parts.push({ type: "logo", width: logoWidth, height: logoHeight });
    }
    if (settings.textEnabled) {
      context.save();
      context.font = font;
      const metrics = context.measureText(settings.text);
      context.restore();
      parts.push({ type: "text", width: metrics.width, height: fontSize * 1.18 });
    }
    if (!parts.length) return;

    const gap = parts.length > 1 ? shortest * 0.018 : 0;
    const blockWidth = Math.max(...parts.map((part) => part.width));
    const blockHeight = parts.reduce((sum, part) => sum + part.height, 0) + gap * (parts.length - 1);
    const baseAngle = settings.angle * Math.PI / 180;

    const drawGroup = (centerX, centerY, angle = baseAngle, scale = 1) => {
      context.save();
      context.translate(centerX, centerY);
      context.rotate(angle);
      context.scale(scale, scale);
      context.globalAlpha = settings.opacity;
      let cursorY = -blockHeight / 2;
      parts.forEach((part) => {
        const partX = -part.width / 2;
        if (part.type === "logo") {
          context.drawImage(settings.logo.image, partX, cursorY, part.width, part.height);
        } else {
          context.font = font;
          context.textAlign = "left";
          context.textBaseline = "top";
          context.fillStyle = settings.textColor;
          context.shadowColor = "rgba(0,0,0,.48)";
          context.shadowBlur = Math.max(2, fontSize * 0.08);
          context.shadowOffsetY = Math.max(1, fontSize * 0.035);
          context.fillText(settings.text, partX, cursorY);
          context.shadowColor = "transparent";
        }
        cursorY += part.height + gap;
      });
      context.restore();
    };

    if (settings.arrangement === "single") {
      const marginX = width * settings.margin;
      const marginY = height * settings.margin;
      const rotatedWidth = Math.abs(blockWidth * Math.cos(baseAngle)) + Math.abs(blockHeight * Math.sin(baseAngle));
      const rotatedHeight = Math.abs(blockWidth * Math.sin(baseAngle)) + Math.abs(blockHeight * Math.cos(baseAngle));
      const [vertical, horizontal] = settings.position.includes("-") ? settings.position.split("-") : [settings.position, settings.position];
      let centerX = marginX + rotatedWidth / 2;
      if (horizontal === "center" || settings.position === "center") centerX = width / 2;
      if (horizontal === "right") centerX = width - marginX - rotatedWidth / 2;
      let centerY = marginY + rotatedHeight / 2;
      if (vertical === "center" || settings.position === "center") centerY = height / 2;
      if (vertical === "bottom") centerY = height - marginY - rotatedHeight / 2;
      drawGroup(centerX, centerY);
      return;
    }

    const columns = Math.max(2, Math.ceil(Math.sqrt(settings.count * width / height)));
    let rows = Math.ceil(settings.count / columns);
    // 错位行整体右移半格，行尾一格会出界，每行少放一个，补足行数保证 count 个水印都完整可见
    while (settings.arrangement === "stagger" && columns * rows - Math.floor(rows / 2) < settings.count) {
      rows += 1;
    }
    const cellWidth = width / columns;
    const cellHeight = height / rows;
    const fittedScale = Math.min(1, cellWidth / (blockWidth * 1.45), cellHeight / (blockHeight * 1.55));

    if (settings.arrangement === "random") {
      const logoKey = settings.logo.file?.name || "no-logo";
      const random = deterministicRandom(`${settings.text}|${logoKey}|${settings.count}|${settings.angle}|${item.file.name}|${item.file.size}`);
      const cells = Array.from({ length: columns * rows }, (_, index) => ({
        column: index % columns,
        row: Math.floor(index / columns),
      }));
      for (let index = cells.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [cells[index], cells[swapIndex]] = [cells[swapIndex], cells[index]];
      }
      cells.slice(0, settings.count).forEach((cell) => {
        const centerX = (cell.column + 0.5 + (random() - 0.5) * 0.46) * cellWidth;
        const centerY = (cell.row + 0.5 + (random() - 0.5) * 0.46) * cellHeight;
        const angle = baseAngle + (random() - 0.5) * (Math.PI / 6);
        const scale = fittedScale * (0.78 + random() * 0.42);
        drawGroup(centerX, centerY, angle, scale);
      });
      return;
    }

    let placed = 0;
    for (let row = 0; row < rows && placed < settings.count; row += 1) {
      const offset = settings.arrangement === "stagger" && row % 2 ? cellWidth / 2 : 0;
      const columnsInRow = columns - (offset ? 1 : 0);
      for (let column = 0; column < columnsInRow && placed < settings.count; column += 1) {
        const centerX = (column + 0.5) * cellWidth + offset;
        const centerY = (row + 0.5) * cellHeight;
        drawGroup(centerX, centerY, baseAngle, fittedScale);
        placed += 1;
      }
    }
  }

  function drawComposite(source, canvas, targetWidth, targetHeight, settings, item) {
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const context = canvas.getContext("2d", { alpha: true });
    context.clearRect(0, 0, targetWidth, targetHeight);
    context.drawImage(source, 0, 0, targetWidth, targetHeight);
    drawWatermarks(context, targetWidth, targetHeight, settings, item);
  }

  function previewDimensions(item) {
    if (item.width && item.height) return { width: item.width, height: item.height };
    if (state.previewImageId === item.id && state.previewImage) {
      return { width: state.previewImage.naturalWidth, height: state.previewImage.naturalHeight };
    }
    return { width: 0, height: 0 };
  }

  function drawPreview() {
    const item = selectedImage();
    if (!item || !state.previewImage || state.previewImageId !== item.id) return;
    const dimensions = previewDimensions(item);
    if (!dimensions.width || !dimensions.height) return;
    const scale = Math.min(1, PREVIEW_MAX_EDGE / Math.max(dimensions.width, dimensions.height));
    drawComposite(
      state.previewImage,
      elements.previewCanvas,
      Math.round(dimensions.width * scale),
      Math.round(dimensions.height * scale),
      currentSettings(),
      item,
    );
    requestAnimationFrame(() => {
      applyZoom(state.zoom, state.zoomMode);
      updatePreviewControls();
    });
  }

  async function chooseLogo(file) {
    if (!file) return;
    if (!isSupportedFile(file)) {
      announce("Logo 格式不支持，请选择 JPG、PNG 或 WebP。", "error");
      return;
    }
    const url = URL.createObjectURL(file);
    try {
      const image = await loadDrawable(url);
      if (image.naturalWidth * image.naturalHeight > MAX_PIXELS) {
        URL.revokeObjectURL(url);
        elements.logoInput.value = "";
        announce("Logo 图片过大，请先缩小后再添加。", "error");
        return;
      }
      if (state.logo.url) URL.revokeObjectURL(state.logo.url);
      state.logo = { file, url, image, width: image.naturalWidth, height: image.naturalHeight };
      elements.logoEnabled.checked = true;
      elements.logoName.textContent = file.name;
      elements.logoPreview.replaceChildren();
      const preview = document.createElement("img");
      preview.src = url;
      preview.alt = "Logo 预览";
      elements.logoPreview.append(preview);
      setControlState();
      drawPreview();
      announce("Logo 已添加，将应用到本批次所有图片。", "success");
    } catch {
      URL.revokeObjectURL(url);
      announce("Logo 文件已损坏或无法读取。", "error");
    }
    elements.logoInput.value = "";
  }

  function outputType(item) {
    const extension = extensionOf(item.file.name);
    if (item.file.type === "image/jpeg" || extension === "jpg" || extension === "jpeg") return { mime: "image/jpeg", extension: "jpg" };
    if (item.file.type === "image/png" || extension === "png") return { mime: "image/png", extension: "png" };
    return { mime: "image/png", extension: "png" };
  }

  function outputName(item, usedNames = new Map()) {
    const format = outputType(item);
    const base = item.file.name.replace(/\.[^.]+$/, "") || "image";
    const key = `${base.toLowerCase()}.${format.extension}`;
    const number = (usedNames.get(key) || 0) + 1;
    usedNames.set(key, number);
    return `${base}-watermark${number > 1 ? `-${number}` : ""}.${format.extension}`;
  }

  function canvasToBlob(canvas, mime) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("浏览器未能生成图片文件")), mime, mime === "image/jpeg" ? 0.92 : undefined);
    });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function createWatermarkedBlob(item, settings) {
    if (!item.url) throw new Error("原图不可用");
    const source = await loadDrawable(item.url);
    const canvas = document.createElement("canvas");
    drawComposite(source, canvas, item.width, item.height, settings, item);
    const format = outputType(item);
    const blob = await canvasToBlob(canvas, format.mime);
    canvas.width = 1;
    canvas.height = 1;
    return blob;
  }

  async function exportSingle(item) {
    if (!item.accepted || state.exporting || item.status === "loading") return;
    const settings = currentSettings();
    if (!settings.textEnabled && !settings.logoEnabled) {
      announce(NO_WATERMARK_MESSAGE, "error");
      return;
    }
    const previousStatus = item.status;
    state.exporting = true;
    item.status = "processing";
    renderList();
    announce(`正在生成 ${item.file.name}…`);
    try {
      const blob = await createWatermarkedBlob(item, settings);
      downloadBlob(blob, outputName(item));
      item.status = "complete";
      announce(`${item.file.name} 已生成，请查看浏览器下载记录。`, "success");
    } catch (error) {
      item.status = previousStatus === "complete" ? "complete" : "ready";
      announce(error instanceof Error ? error.message : "图片导出失败", "error");
    } finally {
      state.exporting = false;
      renderList();
    }
  }

  async function exportBatch(items) {
    if (!items.length || state.exporting) return;
    if (items.length === 1) {
      await exportSingle(items[0]);
      return;
    }

    const settings = currentSettings();
    if (!settings.textEnabled && !settings.logoEnabled) {
      announce(NO_WATERMARK_MESSAGE, "error");
      return;
    }

    state.exporting = true;
    renderList();
    const zip = new JSZip();
    const usedNames = new Map();
    let completed = 0;
    let failed = 0;

    for (const item of items) {
      item.status = "processing";
      renderList();
      announce(`正在处理第 ${completed + failed + 1} / ${items.length} 张：${item.file.name}`);
      try {
        const blob = await createWatermarkedBlob(item, settings);
        zip.file(outputName(item, usedNames), blob);
        item.status = "complete";
        completed += 1;
      } catch (error) {
        item.status = "error";
        item.accepted = false;
        item.exportSelected = false;
        item.error = error instanceof Error ? error.message : "导出失败";
        failed += 1;
      }
    }

    try {
      if (!completed) throw new Error("没有图片成功生成，请检查右侧错误信息");
      announce("正在打包 ZIP，请保持页面开启…");
      const blob = await zip.generateAsync(
        { type: "blob", compression: "STORE" },
        (progress) => announce(`正在打包 ZIP：${Math.round(progress.percent)}%`),
      );
      downloadBlob(blob, `watermarked-images-${new Date().toISOString().slice(0, 10)}.zip`);
      announce(`已打包 ${completed} 张图片${failed ? `，${failed} 张失败` : ""}。`, failed ? "error" : "success");
    } catch (error) {
      announce(error instanceof Error ? error.message : "ZIP 打包失败，请尝试逐张保存", "error");
    } finally {
      state.exporting = false;
      renderList();
    }
  }

  [elements.addImagesButton, elements.emptyAddButton, elements.addMoreButton].forEach((button) => {
    button.addEventListener("click", () => elements.imageInput.click());
  });
  elements.imageInput.addEventListener("change", () => addFiles(elements.imageInput.files));
  elements.logoButton.addEventListener("click", () => elements.logoInput.click());
  elements.logoInput.addEventListener("change", () => chooseLogo(elements.logoInput.files?.[0]));
  elements.resetButton.addEventListener("click", clearAll);
  elements.exportAllButton.addEventListener("click", () => exportBatch(exportableImages()));
  elements.exportButton.addEventListener("click", () => exportBatch(selectedForExportImages()));
  elements.selectAllToggle.addEventListener("change", () => {
    exportableImages().forEach((item) => {
      item.exportSelected = elements.selectAllToggle.checked;
    });
    const count = selectedForExportImages().length;
    renderList();
    announce(count ? `已选择全部 ${count} 张可导出图片。` : "已取消全部导出选择。");
  });

  elements.previousImageButton.addEventListener("click", () => navigatePreview(-1));
  elements.nextImageButton.addEventListener("click", () => navigatePreview(1));
  elements.zoomOutButton.addEventListener("click", () => setZoom(state.zoom / 1.2));
  elements.zoomInButton.addEventListener("click", () => setZoom(state.zoom * 1.2));
  elements.fitButton.addEventListener("click", () => applyZoom(state.fitZoom, "fit", true));
  elements.actualSizeButton.addEventListener("click", () => applyZoom(1, "actual", true));

  [elements.textEnabled, elements.logoEnabled].forEach((control) => {
    control.addEventListener("change", () => {
      setControlState();
      drawPreview();
    });
  });
  [elements.watermarkText, elements.textColor, elements.textSize, elements.logoSize, elements.margin, elements.density, elements.angle, elements.opacity].forEach((control) => {
    control.addEventListener("input", () => {
      updateRangeLabels();
      drawPreview();
    });
  });

  elements.arrangementTabs.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-arrangement]");
    if (!button) return;
    state.arrangement = button.dataset.arrangement;
    if (state.arrangement !== "single" && Number(elements.angle.value) === 0) {
      elements.angle.value = "-25";
    }
    elements.arrangementTabs.querySelectorAll("button").forEach((item) => {
      const selected = item === button;
      item.classList.toggle("is-selected", selected);
      item.setAttribute("aria-checked", String(selected));
    });
    setControlState();
    updateRangeLabels();
    drawPreview();
    const labels = { single: "单个", tile: "整齐平铺", stagger: "错位多排", random: "随机散布" };
    announce(`已切换为${labels[state.arrangement]}水印。`, "success");
  });

  elements.positionGrid.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-position]");
    if (!button) return;
    state.position = button.dataset.position;
    elements.positionGrid.querySelectorAll("button").forEach((item) => {
      const selected = item === button;
      item.classList.toggle("is-selected", selected);
      item.setAttribute("aria-checked", String(selected));
    });
    drawPreview();
  });

  let dragDepth = 0;
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => event.preventDefault());
  elements.dropTarget.addEventListener("dragenter", (event) => {
    event.preventDefault();
    dragDepth += 1;
    elements.dropTarget.classList.add("is-dragging");
  });
  elements.dropTarget.addEventListener("dragleave", () => {
    dragDepth -= 1;
    if (dragDepth <= 0) {
      dragDepth = 0;
      elements.dropTarget.classList.remove("is-dragging");
    }
  });
  elements.dropTarget.addEventListener("drop", (event) => {
    event.preventDefault();
    dragDepth = 0;
    elements.dropTarget.classList.remove("is-dragging");
    addFiles(event.dataTransfer.files);
  });

  elements.dropTarget.addEventListener("wheel", (event) => {
    if (!event.ctrlKey || !selectedImage() || elements.canvasWrap.hidden) return;
    event.preventDefault();
    const factor = Math.exp(-event.deltaY * 0.012);
    setZoom(state.zoom * factor);
  }, { passive: false });

  let gestureStartZoom = 1;
  elements.dropTarget.addEventListener("gesturestart", (event) => {
    if (!selectedImage() || elements.canvasWrap.hidden) return;
    event.preventDefault();
    gestureStartZoom = state.zoom;
  }, { passive: false });
  elements.dropTarget.addEventListener("gesturechange", (event) => {
    if (!selectedImage() || elements.canvasWrap.hidden) return;
    event.preventDefault();
    setZoom(gestureStartZoom * event.scale);
  }, { passive: false });

  elements.previewCanvas.addEventListener("dblclick", () => applyZoom(state.fitZoom, "fit", true));

  window.addEventListener("keydown", (event) => {
    const target = event.target;
    const isEditing = target instanceof HTMLElement && (target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName));
    if (isEditing || event.altKey || event.metaKey || event.ctrlKey) return;
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      navigatePreview(-1);
    }
    if (event.key === "ArrowRight") {
      event.preventDefault();
      navigatePreview(1);
    }
  });

  let resizeFrame = 0;
  window.addEventListener("resize", () => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (state.zoomMode === "fit") applyZoom(state.fitZoom, "fit");
    });
  });

  if ("ResizeObserver" in window) {
    const stageObserver = new ResizeObserver(() => {
      if (state.zoomMode !== "fit" || elements.canvasWrap.hidden) return;
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => applyZoom(state.fitZoom, "fit"));
    });
    stageObserver.observe(elements.dropTarget);
  }

  window.addEventListener("beforeunload", () => {
    state.images.forEach((item) => item.url && URL.revokeObjectURL(item.url));
    if (state.logo.url) URL.revokeObjectURL(state.logo.url);
  });

  setControlState();
  updateRangeLabels();
  renderList();
  updatePreviewHeader();
  announce("准备就绪：添加图片后即可开始编辑。", "success");
})();
</script>
  </body>
</html>
